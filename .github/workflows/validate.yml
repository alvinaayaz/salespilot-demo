name: Validate SalesPilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py storage.py tests
      - run: python -m unittest discover -s tests -v
      - run: python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('app.py').run(); assert not app.exception, app.exception"
